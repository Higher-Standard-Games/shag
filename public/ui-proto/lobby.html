<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lobby UI prototype — rail + hero</title>

<style>
/* Real project fonts, served from public/engine/fonts */
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-Black.ttf") format("truetype"); font-weight: 900; font-display: block; }
@font-face { font-family: "Rajdhani"; src: url("/engine/fonts/Rajdhani/Rajdhani-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Rajdhani"; src: url("/engine/fonts/Rajdhani/Rajdhani-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Rajdhani"; src: url("/engine/fonts/Rajdhani/Rajdhani-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

:root {
  --w-cyan: hsl(180, 100%, 50%);
  --w-magenta: hsl(320, 100%, 60%);
  --w-gold: hsl(45, 100%, 55%);
  --w-bg: hsl(240, 20%, 5%);
  --w-ink: hsl(250, 40%, 5%);
  --w-cream: hsl(42, 95%, 92%);
  --w-void: hsla(255, 28%, 6%, 0.94);
  --w-text: hsl(180, 100%, 95%);
  --w-text-muted: hsl(220, 10%, 55%);
  --w-font-display: "Orbitron", monospace;
  --w-font-body: "Rajdhani", sans-serif;
  --w-scan-cyan: repeating-linear-gradient(0deg, hsla(190,100%,72%,0.08) 0 1px, transparent 1px 8px);
  --w-scan-cream: repeating-linear-gradient(0deg, hsla(42,100%,78%,0.10) 0 1px, transparent 1px 7px);

  --rail-w: 26%;
  --rail-skew: 44px;   /* was 22 — the lean now actually reads */
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--w-bg); color: var(--w-text);
  font-family: var(--w-font-body); overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(1100px 700px at 78% 18%, hsla(320,100%,60%,0.10), transparent 62%),
    radial-gradient(900px 600px at 30% 88%, hsla(180,100%,50%,0.08), transparent 60%),
    var(--w-bg);
}
.shell { position: relative; z-index: 1; display: flex; height: 100vh; }

/* ══════════════════════════ LEFT RAIL ══════════════════════════ */
.rail {
  position: relative; flex: 0 0 var(--rail-w);
  display: flex; flex-direction: column; gap: 4px;
  padding: 24px 0 18px;
  background: linear-gradient(176deg, hsla(250,32%,9%,0.98), var(--w-void)), var(--w-scan-cyan);
  clip-path: polygon(0 0, 100% 0, calc(100% - var(--rail-skew)) 100%, 0 100%);
  overflow: hidden;
}
.rail::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: 0; z-index: 2;
  width: calc(var(--rail-skew) + 7px);
  background: linear-gradient(180deg, var(--w-gold), hsl(38,92%,46%));
  clip-path: polygon(calc(100% - 7px) 0, 100% 0, calc(100% - var(--rail-skew)) 100%, calc(100% - var(--rail-skew) - 7px) 100%);
}

/* Kanji watermark — fills the rail's quiet zone on purpose */
.rail-kanji {
  position: absolute; right: 8%; bottom: 16%; z-index: 0;
  font-family: serif; font-size: clamp(180px, 20vw, 300px); line-height: 0.8;
  color: hsla(180,100%,60%,0.05); pointer-events: none; user-select: none;
}
body.rail-gold .rail-kanji { color: hsla(250,40%,5%,0.10); }

.rail > *:not(.rail-kanji) { position: relative; z-index: 1; }

/* Gold variant */
body.rail-gold .rail {
  background: linear-gradient(168deg, hsl(45,100%,58%), hsl(40,94%,49%)), var(--w-scan-cream);
  color: var(--w-ink);
}
body.rail-gold .rail::after { background: linear-gradient(180deg, hsl(320,100%,60%), hsl(300,90%,45%)); }
body.rail-gold .rail-label { color: hsla(250,40%,5%,0.66); }
body.rail-gold .nav-item {
  background: hsla(250,40%,5%,0.92); color: var(--w-cream);
  border-color: hsla(250,40%,5%,0.5);
  box-shadow: 4px 5px 0 hsla(250,45%,4%,0.28), inset 5px 0 0 hsla(45,100%,55%,0.5);
}
body.rail-gold .nav-item.is-active {
  background: var(--w-ink); color: var(--w-cream);
  box-shadow: 5px 6px 0 hsla(320,100%,45%,0.6), inset 6px 0 0 var(--w-gold);
}
/* No cyan/gold blending on a gold field — mode rows stay ink, accent is the inset only */
body.rail-gold .mode-item { background: hsla(250,40%,5%,0.9); border-color: hsla(250,40%,5%,0.45); color: var(--w-cream); }
body.rail-gold .mode-item.is-active { background: hsla(250,40%,5%,0.98); border-color: var(--mode-accent); }
body.rail-gold .live-row { background: hsla(250,40%,5%,0.88); border-color: hsla(250,40%,5%,0.4); color: var(--w-cream); }
body.rail-gold .player-card { background: hsla(250,40%,5%,0.9); border-color: hsla(250,40%,5%,0.45); }
body.rail-gold .player-name { color: var(--w-cream); }
body.rail-gold .util-btn { color: hsla(250,40%,5%,0.82); border-color: hsla(250,40%,5%,0.32); }
body.rail-gold .util-btn:hover { color: var(--w-ink); border-color: var(--w-ink); background: hsla(0,0%,100%,0.28); }

/* --- Items: Flat --- gold becomes the surface, not the gap between slabs.
   Ink text sits straight on the yellow; only the active item earns a dark slab. */
body.items-flat .nav-item {
  background: hsla(250,40%,5%,0.06); border-color: hsla(250,40%,5%,0.26);
  color: var(--w-ink); box-shadow: inset 5px 0 0 hsla(250,40%,5%,0.3);
}
body.items-flat .nav-item .nav-hint,
body.items-flat .nav-item .nav-chevron { color: hsla(250,40%,5%,0.62); }
body.items-flat .nav-item:hover {
  background: hsla(250,40%,5%,0.14); border-color: hsla(250,40%,5%,0.5);
  box-shadow: 5px 6px 0 hsla(250,45%,4%,0.22), inset 6px 0 0 hsla(250,40%,5%,0.5);
}
body.items-flat .nav-item.is-active {
  background: var(--w-ink); color: var(--w-cream); border-color: hsla(250,40%,5%,0.9);
  box-shadow: 5px 6px 0 hsla(320,100%,45%,0.55), inset 6px 0 0 var(--w-gold);
}
body.items-flat .nav-item.is-active .nav-hint,
body.items-flat .nav-item.is-active .nav-chevron { color: hsla(42,95%,92%,0.66); }

body.items-flat .mode-item {
  background: hsla(250,40%,5%,0.05); color: var(--w-ink);
  border-color: hsla(250,40%,5%,0.2);
  box-shadow: inset 6px 0 0 var(--mode-accent);
}
body.items-flat .mode-item:hover { background: hsla(250,40%,5%,0.13); }
body.items-flat .mode-item.is-active {
  background: hsla(250,42%,5%,0.96); color: var(--w-cream);
  box-shadow: 5px 6px 0 hsla(250,45%,4%,0.3), inset 7px 0 0 var(--mode-accent);
}

body.items-flat .live-row {
  background: hsla(250,40%,5%,0.05); color: var(--w-ink); border-color: hsla(250,40%,5%,0.22);
  box-shadow: none;
}
body.items-flat .live-row:hover { background: hsla(250,40%,5%,0.13); }
body.items-flat .live-meta { color: hsla(250,40%,5%,0.6); }
body.items-flat .live-join { background: var(--w-ink); color: var(--w-gold); }
body.items-flat .player-card { background: hsla(250,40%,5%,0.06); border-color: hsla(250,40%,5%,0.24); }
body.items-flat .player-name { color: var(--w-ink); }
body.items-flat .player-meta { color: hsla(250,40%,5%,0.62); }

/* The wordmark sits straight on the gold — it gets adjusted to suit the field
   rather than the field getting a dark plate to rescue it. */
.brand { position: relative; padding: 2px 26px 20px; }
.brand-logo {
  display: block; width: 100%; max-width: 430px; height: auto;
  filter: drop-shadow(0 5px 12px hsla(250,60%,3%,0.35));
}
.brand-sub {
  margin-top: 8px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.26em; text-transform: uppercase;
  color: hsla(250,40%,5%,0.62);
}

.rail-label {
  padding: 0 26px; margin: 14px 0 7px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--w-text-muted);
}

.nav { display: flex; flex-direction: column; gap: 7px; padding: 0 22px 0 18px; }

.nav-item {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  width: 100%; min-height: 58px; padding: 14px 18px;
  border: 2px solid hsla(180,100%,50%,0.28);
  background: linear-gradient(92deg, hsla(180,100%,50%,0.16), hsla(0,0%,100%,0.055) 52%, hsla(45,100%,55%,0.08)), hsla(238,38%,8%,0.95);
  color: var(--w-text);
  clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
  box-shadow: 4px 5px 0 hsla(0,0%,0%,0.32), inset 5px 0 0 hsla(180,100%,50%,0.44);
  cursor: pointer; text-align: left;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
}
.nav-item:hover {
  transform: translate(-2px,-2px); border-color: hsla(180,100%,50%,0.72);
  box-shadow: 7px 8px 0 hsla(0,0%,0%,0.36), inset 6px 0 0 hsla(45,100%,55%,0.7);
}
.nav-label { font-family: var(--w-font-display); font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; }
.nav-hint { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.62; white-space: nowrap; }
.nav-item.is-active {
  border-color: hsla(45,100%,55%,0.58);
  background: linear-gradient(92deg, hsla(45,100%,55%,0.95), hsla(45,100%,55%,0.62)), var(--w-gold);
  color: hsl(246,38%,7%);
  box-shadow: 5px 6px 0 hsla(320,100%,60%,0.55), inset 5px 0 0 hsla(0,0%,100%,0.34);
}

/* --- Accordion: PLAY actually toggles, and says so --- */
.nav-right { display: inline-flex; align-items: center; gap: 10px; }
.nav-chevron { font-size: 11px; transition: transform .16s ease; opacity: 0.8; }
body.nav-collapsed .nav-chevron { transform: rotate(-90deg); }
body.nav-collapsed .submenu { display: none; }

/* --- Flat: no parent at all, modes sit directly in the rail --- */
body.nav-flat .nav-play { display: none; }
body.nav-flat .submenu {
  margin: 0; padding: 0 22px 0 18px; border-left: none; gap: 7px;
}
body.nav-flat .mode-item { min-height: 58px; padding: 14px 18px; }
body.nav-flat .mode-name { font-size: 20px; letter-spacing: 0.08em; }

.submenu {
  display: flex; flex-direction: column; gap: 6px;
  margin: 7px 0 0 26px; padding: 8px 22px 2px 26px;
  border-left: 2px solid hsla(45,100%,55%,0.35);
}
body.rail-gold .submenu { border-left-color: hsla(250,40%,5%,0.32); }
.mode-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; min-height: 42px; padding: 9px 14px;
  border: 2px solid hsla(180,100%,50%,0.2);
  background: hsla(238,38%,8%,0.92); color: var(--w-text);
  clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
  box-shadow: 3px 4px 0 hsla(0,0%,0%,0.3), inset 5px 0 0 var(--mode-accent, hsla(180,100%,50%,0.5));
  cursor: pointer; text-align: left;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.mode-item:hover { transform: translate(-2px,-2px); box-shadow: 6px 7px 0 hsla(0,0%,0%,0.34), inset 6px 0 0 var(--mode-accent); }
.mode-item.is-active { border-color: var(--mode-accent); box-shadow: 5px 6px 0 hsla(0,0%,0%,0.4), inset 7px 0 0 var(--mode-accent); }
.mode-name { font-family: var(--w-font-display); font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.07em; }
.mode-go { margin-left: auto; font-size: 13px; color: var(--mode-accent); opacity: 0; transition: opacity .14s ease, transform .14s ease; }
.mode-item:hover .mode-go { opacity: 0.8; transform: translateX(3px); }
.mode-item.is-active .mode-go { opacity: 1; }
/* The Play header only earns its place when there is no Play button above it */
body:not(.nav-flat) .play-label { display: none; }

/* Live matches moved INTO the rail — "what's happening now" belongs with navigation,
   and it fills the quiet zone with something worth clicking. */
.live-list { display: flex; flex-direction: column; gap: 6px; padding: 0 22px 0 18px; }
.live-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 14px; border: 1.5px solid hsla(320,100%,60%,0.26);
  background: hsla(238,38%,8%,0.88); color: var(--w-text);
  clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
  box-shadow: 3px 4px 0 hsla(0,0%,0%,0.3);
  cursor: pointer; text-align: left;
  transition: transform .12s ease, border-color .12s ease;
}
.live-row:hover { transform: translate(-2px,-2px); border-color: hsla(45,100%,55%,0.7); }
.live-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--w-magenta); box-shadow: 0 0 8px var(--w-magenta); }
.live-name { font-family: var(--w-font-display); font-size: 12px; font-weight: 900; letter-spacing: 0.06em; }
.live-meta { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--w-text-muted); letter-spacing: 0.06em; }
body.rail-gold .live-meta { color: hsla(42,95%,92%,0.55); }
.live-join {
  padding: 3px 11px; background: var(--w-gold); color: var(--w-ink);
  font-family: var(--w-font-display); font-size: 10px; font-weight: 900; letter-spacing: 0.1em;
  clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}

.rail-spacer { flex: 1; min-height: 12px; }

.player-card {
  display: flex; align-items: center; gap: 12px;
  margin: 0 22px 10px 18px; padding: 11px 16px;
  background: hsla(238,38%,8%,0.9); border: 2px solid hsla(180,100%,50%,0.24);
  clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
}
.player-avatar { width: 36px; height: 36px; flex: 0 0 36px; background: linear-gradient(135deg, var(--w-cyan), var(--w-magenta)); clip-path: polygon(14% 0, 100% 8%, 88% 100%, 0 90%); }
.player-name { font-family: var(--w-font-display); font-size: 13px; font-weight: 800; letter-spacing: 0.05em; }
.player-meta { font-size: 12px; font-weight: 600; color: var(--w-text-muted); letter-spacing: 0.08em; }

.util-row { display: flex; gap: 7px; padding: 0 22px 0 18px; }
.util-btn {
  flex: 1; padding: 8px 5px; background: none;
  border: 1.5px solid hsla(180,100%,50%,0.24); color: var(--w-text-muted);
  font-family: var(--w-font-body); font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
  transition: color .12s ease, border-color .12s ease, background .12s ease;
}
.util-btn:hover { color: var(--w-gold); border-color: hsla(45,100%,55%,0.6); }

/* ══════════════════════════ STAGE ══════════════════════════ */
.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px 30px 20px 10px; gap: 14px; }

.hero {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  border: 2px solid hsla(180,100%,50%,0.26);
  clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 100%, 0 100%);
  box-shadow: 12px 13px 0 hsla(250,45%,4%,0.6);
}
.hero-art { position: absolute; inset: 0; background-image: url("/data/acidwdm2.jpg"); background-size: cover; background-position: center; filter: saturate(0.9) contrast(1.05); }
body.no-art .hero-art { display: none; }
.hero-scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(92deg, hsla(248,42%,5%,0.92) 0%, hsla(248,42%,5%,0.62) 34%, hsla(248,42%,5%,0.14) 70%, transparent 100%),
    linear-gradient(0deg, hsla(248,42%,5%,0.92) 0%, transparent 40%),
    linear-gradient(180deg, hsla(248,42%,5%,0.78) 0%, transparent 34%),
    var(--w-scan-cyan);
}

/* Top block = identity, bottom block = action. The art lives between them
   instead of under everything. */
.hero-body { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 36px 28px; }
body.hero-bottom .hero-body { justify-content: flex-end; gap: 12px; }
body.hero-bottom .hero-top { margin-bottom: 2px; }
/* Stack: one block top-left, the rest is deliberately just art */
body.hero-stack .hero-body { justify-content: flex-start; gap: 20px; }

.hero-top { display: flex; flex-direction: column; gap: 6px; }
.hero-kicker { display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--w-gold); }
.hero-map { color: var(--w-text-muted); letter-spacing: 0.16em; }
.hero-title {
  margin: 0; font-family: var(--w-font-display);
  font-size: clamp(54px, 6.6vw, 100px); font-weight: 900; line-height: 0.84; letter-spacing: -0.01em;
  color: var(--w-cream); text-shadow: 5px 6px 0 var(--w-ink), -2px 0 0 hsla(0,0%,100%,0.18);
}
.hero-line { margin: 4px 0 0; max-width: 44ch; font-size: 17px; font-weight: 600; color: hsla(180,100%,95%,0.84); }

.hero-bottom-block { display: flex; flex-direction: column; gap: 12px; }
.hero-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.cta {
  display: inline-flex; align-items: center; gap: 14px;
  min-height: 60px; padding: 15px 38px;
  border: 2px solid hsla(45,100%,55%,0.6);
  background: linear-gradient(92deg, hsl(45,100%,58%), hsl(48,100%,64%));
  color: hsl(246,38%,7%);
  font-family: var(--w-font-display); font-size: 19px; font-weight: 900;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
  box-shadow: 7px 8px 0 hsla(320,100%,60%,0.6), inset 6px 0 0 hsla(0,0%,100%,0.34);
  transition: transform .14s ease, box-shadow .14s ease;
}
.cta:hover { transform: translate(-3px,-3px); box-shadow: 11px 12px 0 hsla(320,100%,60%,0.72), inset 6px 0 0 hsla(0,0%,100%,0.5); }
.cta:active { transform: translate(1px,1px); box-shadow: 4px 5px 0 hsla(320,100%,60%,0.6); }

.hero-specs { display: flex; gap: 9px; flex-wrap: wrap; }
.spec {
  padding: 6px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: hsla(180,100%,95%,0.78); background: hsla(248,42%,5%,0.76); border: 1px solid hsla(180,100%,50%,0.26);
  clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
}

/* Demos: brighter, wider, actually inviting */
.demos { flex: 0 0 auto; }
.strip-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: hsla(180,100%,95%,0.6); }
.strip-head span:last-child { color: var(--w-gold); cursor: pointer; }
.demo-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.demo-card {
  display: flex; align-items: center; gap: 13px; padding: 13px 16px;
  background: linear-gradient(92deg, hsla(180,100%,50%,0.1), hsla(238,38%,8%,0.92) 60%);
  border: 1.5px solid hsla(180,100%,50%,0.3);
  clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
  box-shadow: 4px 5px 0 hsla(0,0%,0%,0.34);
  cursor: pointer; text-align: left;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.demo-card:hover { transform: translate(-2px,-2px); border-color: hsla(45,100%,55%,0.7); box-shadow: 7px 8px 0 hsla(0,0%,0%,0.38); }
.demo-thumb { width: 44px; height: 44px; flex: 0 0 44px; background: linear-gradient(140deg, hsl(190,90%,45%), hsl(250,60%,18%)); clip-path: polygon(14% 0, 100% 8%, 88% 100%, 0 90%); }
.demo-map { font-family: var(--w-font-display); font-size: 13px; font-weight: 900; letter-spacing: 0.06em; color: var(--w-cream); }
.demo-meta { font-size: 12px; font-weight: 700; color: var(--w-text-muted); letter-spacing: 0.06em; }
.demo-time { margin-left: auto; font-family: var(--w-font-display); font-size: 13px; font-weight: 800; color: var(--w-gold); }

.chat { flex: 0 0 auto; }
.chat-bar {
  display: flex; align-items: center; gap: 14px; padding: 13px 18px;
  background: hsla(238,38%,8%,0.92); border: 1.5px solid hsla(320,100%,60%,0.3);
  clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
}
.chat-label { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--w-magenta); }
.chat-input { flex: 1; background: none; border: none; outline: none; color: var(--w-text); font-family: var(--w-font-body); font-size: 15px; font-weight: 600; }
.chat-input::placeholder { color: var(--w-text-muted); }
.chat-toggle { background: none; border: none; color: var(--w-text-muted); cursor: pointer; font-size: 15px; }

/* ══════════════════════════ PROTO CONTROLS ══════════════════════════ */
.proto {
  position: fixed; top: 10px; right: 14px; z-index: 50;
  display: flex; gap: 6px; align-items: center; padding: 7px 10px;
  background: hsla(248,42%,5%,0.94); border: 1px solid hsla(180,100%,50%,0.3);
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
}
.proto span { color: var(--w-text-muted); font-weight: 700; margin-right: 2px; }
.proto button {
  padding: 4px 9px; background: none; border: 1px solid hsla(180,100%,50%,0.3);
  color: var(--w-text); font-family: var(--w-font-body); font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; cursor: pointer;
}
.proto button:hover, .proto button.on { background: var(--w-gold); color: var(--w-ink); border-color: var(--w-gold); }
</style>
</head>

<body class="rail-gold">

<div class="proto">
  <span>Width</span>
  <button data-w="22%">22</button>
  <button data-w="26%" class="on">26</button>
  <button data-w="30%">30</button>
  <span style="margin-left:8px">Nav</span>
  <button data-nav="flat" class="on">Flat</button>
  <button data-nav="accordion">Accordion</button>
  <span style="margin-left:8px">Items</span>
  <button data-items="slab" class="on">Slab</button>
  <button data-items="flat">Flat</button>
  <span style="margin-left:8px">Hero</span>
  <button data-hero="split" class="on">Split</button>
  <button data-hero="stack">Stack</button>
  <button data-hero="bottom">Bottom</button>
  <span style="margin-left:8px">Art</span>
  <button data-art="on" class="on">On</button>
  <button data-art="off">Off</button>
</div>

<div class="shell">

  <nav class="rail">
    <div class="rail-kanji">闘</div>

    <div class="brand">
      <img class="brand-logo" src="/data/washoi.png" alt="Washiki Washoi" />
      <div class="brand-sub">Arena FPS</div>
    </div>

    <div class="nav nav-play">
      <button class="nav-item is-active" id="playToggle">
        <span class="nav-label">Play</span>
        <span class="nav-right">
          <span class="nav-hint">3 modes</span>
          <span class="nav-chevron">▾</span>
        </span>
      </button>
    </div>

    <div class="rail-label play-label">Play</div>
    <div class="submenu">
      <button class="mode-item is-active" style="--mode-accent: hsl(180,100%,50%)">
        <span class="mode-name">Duel</span><span class="mode-go">▸</span>
      </button>
      <button class="mode-item" style="--mode-accent: hsl(45,100%,55%)">
        <span class="mode-name">FFA</span><span class="mode-go">▸</span>
      </button>
      <button class="mode-item" style="--mode-accent: hsl(320,100%,60%)">
        <span class="mode-name">S&amp;D</span><span class="mode-go">▸</span>
      </button>
    </div>

    <div class="nav" style="margin-top:12px">
      <button class="nav-item"><span class="nav-label">Demos</span><span class="nav-hint">12 saved</span></button>
      <button class="nav-item"><span class="nav-label">Leaderboard</span><span class="nav-hint">Season 1</span></button>
    </div>

    <div class="rail-label">Live now · 2</div>
    <div class="live-list">
      <button class="live-row">
        <span class="live-dot"></span><span class="live-name">DUEL</span>
        <span class="live-meta">0 / 2</span><span class="live-join">Join</span>
      </button>
      <button class="live-row">
        <span class="live-dot"></span><span class="live-name">DUEL</span>
        <span class="live-meta">0 / 2</span><span class="live-join">Join</span>
      </button>
    </div>

    <div class="rail-spacer"></div>

    <div class="player-card">
      <div class="player-avatar"></div>
      <div>
        <div class="player-name">sundflux</div>
        <div class="player-meta">1 online</div>
      </div>
    </div>

    <div class="util-row">
      <button class="util-btn">Profile</button>
      <button class="util-btn">Settings</button>
      <button class="util-btn">Console ~</button>
    </div>
  </nav>

  <main class="stage">

    <section class="hero">
      <div class="hero-art"></div>
      <div class="hero-scrim"></div>
      <div class="hero-body">

        <div class="hero-top">
          <div class="hero-kicker">
            <span>Match Ticket No. 01</span>
            <span class="hero-map">acidwdm2</span>
          </div>
          <h1 class="hero-title">DUEL</h1>
          <p class="hero-line">Timing, aim, and nerve. Nothing extra.</p>
        </div>

        <div class="hero-bottom-block">
          <div class="hero-specs">
            <span class="spec">One on one</span>
            <span class="spec">Control pace</span>
            <span class="spec">Item timing</span>
            <span class="spec">Rail · Rocket · Blade</span>
          </div>
          <div class="hero-actions">
            <button class="cta">Find Duel →</button>
          </div>
        </div>

      </div>
    </section>

    <section class="demos">
      <div class="strip-head"><span>Recent demos</span><span>View all →</span></div>
      <div class="demo-row">
        <button class="demo-card">
          <div class="demo-thumb"></div>
          <div><div class="demo-map">BRIMSTONE</div><div class="demo-meta">Deathmatch · 8 players</div></div>
          <div class="demo-time">4:04</div>
        </button>
        <button class="demo-card">
          <div class="demo-thumb"></div>
          <div><div class="demo-map">BRIMSTONE</div><div class="demo-meta">Deathmatch · 8 players</div></div>
          <div class="demo-time">6:22</div>
        </button>
        <button class="demo-card">
          <div class="demo-thumb"></div>
          <div><div class="demo-map">ACIDWDM2</div><div class="demo-meta">Duel · 2 players</div></div>
          <div class="demo-time">6:45</div>
        </button>
      </div>
    </section>

    <section class="chat">
      <div class="chat-bar">
        <span class="chat-label">Lobby</span>
        <input class="chat-input" placeholder="Say something…" />
        <button class="chat-toggle">▴</button>
      </div>
    </section>

  </main>
</div>

<script>
  const proto = document.querySelector(".proto");
  proto.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const group = b.dataset.w ? "w" : b.dataset.nav ? "nav" : b.dataset.items ? "items"
                : b.dataset.hero ? "hero" : "art";
    for (const sib of proto.querySelectorAll(`button[data-${group}]`)) sib.classList.remove("on");
    b.classList.add("on");
    if (b.dataset.w) document.documentElement.style.setProperty("--rail-w", b.dataset.w);
    if (b.dataset.items) document.body.classList.toggle("items-flat", b.dataset.items === "flat");
    if (b.dataset.nav) {
      document.body.classList.toggle("nav-flat", b.dataset.nav === "flat");
      document.body.classList.remove("nav-collapsed");
    }
    if (b.dataset.hero) {
      document.body.classList.remove("hero-bottom", "hero-stack");
      if (b.dataset.hero !== "split") document.body.classList.add(`hero-${b.dataset.hero}`);
    }
    if (b.dataset.art) document.body.classList.toggle("no-art", b.dataset.art === "off");
  });

  // Flat is the default: three modes need no parent.
  document.body.classList.add("nav-flat");

  // In accordion mode, PLAY earns its button appearance.
  document.getElementById("playToggle").addEventListener("click", () => {
    document.body.classList.toggle("nav-collapsed");
  });

  const MODES = {
    Duel:  { title: "DUEL", ticket: "No. 01", line: "Timing, aim, and nerve. Nothing extra.",
             specs: ["One on one","Control pace","Item timing","Rail · Rocket · Blade"] },
    FFA:   { title: "FFA",  ticket: "No. 02", line: "Spawn hot, scrap hard, steal the lead.",
             specs: ["Open pit","Fast chaos","Fast respawn","GL · Rocket · Blade"] },
    "S&D": { title: "S&D",  ticket: "No. 03", line: "Plant it, or make sure they never do.",
             specs: ["5 vs 5 rounds","One life","Two sites","Rocket · Bomb · Armor"] },
  };
  document.querySelectorAll(".mode-item").forEach((item) => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".mode-item").forEach((i) => i.classList.remove("is-active"));
      item.classList.add("is-active");
      const m = MODES[item.querySelector(".mode-name").textContent.trim()];
      if (!m) return;
      document.querySelector(".hero-title").textContent = m.title;
      document.querySelector(".hero-line").textContent = m.line;
      document.querySelector(".hero-kicker span").textContent = `Match Ticket ${m.ticket}`;
      document.querySelector(".cta").textContent = `Find ${m.title} →`;
      document.querySelector(".hero-specs").innerHTML = m.specs.map((s) => `<span class="spec">${s}</span>`).join("");
    });
  });
</script>
</body>
</html>
