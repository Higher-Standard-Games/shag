<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lobby room prototype</title>

<style>
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
@font-face { font-family: "Orbitron"; src: url("/engine/fonts/Orbitron/static/Orbitron-Black.ttf") format("truetype"); font-weight: 900; font-display: block; }
@font-face { font-family: "Rajdhani"; src: url("/engine/fonts/Rajdhani/Rajdhani-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Rajdhani"; src: url("/engine/fonts/Rajdhani/Rajdhani-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

:root {
  --ink: hsl(250 45% 7%);
  --cream: hsl(45 100% 95%);
  --gold-text: hsl(46 100% 60%);
  --violet: hsl(276 90% 64%);
  --display: "Orbitron", monospace;
  --body: "Rajdhani", sans-serif;

  --depth: 6px;       /* how far every key stands off its tray */
  --iso: 0.75;        /* oblique extrusion: the side shows below and to the right */
  --rail-w: 26%;
  --rail-skew: 44px;

  /* Stage accent, set per gametype */
  --a: hsl(182 95% 52%);
  --a-hi: hsl(182 100% 74%);
  --a-lo: hsl(188 90% 40%);
  --a-side-hi: hsl(192 85% 28%);
  --a-side-lo: hsl(198 80% 17%);
}

* { box-sizing: border-box; }

/* The ground behind the stage: a deep blue, lifted by the stage's drifting light */
:root { --ground: linear-gradient(165deg, hsl(222 56% 17%), hsl(217 58% 24%) 55%, hsl(224 52% 16%)); }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--ground); color: var(--cream); font-family: var(--body);
}
.shell { position: relative; display: flex; height: 100vh; }

/* ═══════════════════════════════ 3D KEY ═══════════════════════════════
   Two layers with the same sharp cut: the face, and the side it stands on.
   clip-path cuts away anything outside the polygon, shadows included, so the
   depth is a real layer and the cast shadow lives on the unclipped parent.
   --press moves the face: negative lifts it off the side, 1 sinks it flat. */
.k {
  --d: var(--depth);
  --dx: calc(var(--d) * var(--iso));
  --cut: 3%;
  --press: 0;

  --face: linear-gradient(180deg, hsl(51 100% 73%), hsl(46 100% 58%) 55%, hsl(42 100% 50%));
  --side: linear-gradient(180deg, hsl(36 92% 40%), hsl(28 88% 25%));
  --text: hsl(250 45% 8%);
  --sub: hsla(250, 45%, 8%, 0.62);
  --shadow: hsla(28, 90%, 14%, 0.42);

  position: relative; display: block; width: 100%;
  margin: 0 0 calc(var(--d) + 8px);
  padding: 0; border: 0; background: none; color: inherit;
  font: inherit; text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent; outline: none;
  filter: drop-shadow(
    calc(var(--dx) * (1 - var(--press)) + 2px)
    calc(var(--d) * (1 - var(--press)) + 5px)
    9px var(--shadow)
  );
  transition: filter .14s ease;
}
.k-side,
.k-face { clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
.k-side {
  position: absolute; inset: 0; z-index: 0;
  background: var(--side);
  transform: translate(var(--dx), var(--d));
}
.k-face {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 60px; padding: 14px 22px 14px 26px;
  background: var(--face); color: var(--text);
  transform: translate(calc(var(--dx) * var(--press)), calc(var(--d) * var(--press)));
  transition: transform .15s cubic-bezier(.2, .9, .3, 1.25);
}
/* Lit top edge: the bevel that makes it a key rather than a card */
.k-face::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: hsla(0, 0%, 100%, 0.55); pointer-events: none;
}
.k-face::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: hsla(250, 60%, 5%, 0.14); pointer-events: none;
}

.k-label { font: 900 20px/1 var(--display); letter-spacing: 0.07em; text-transform: uppercase; }
.k-hint  { font: 700 13px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* ── Variants ── */
.k--nav .k-face { min-height: 66px; padding: 17px 24px 17px 28px; }
.k--nav .k-label { font-size: clamp(15px, 1.1vw, 21px); }

.k--sm { --d: calc(var(--depth) * 0.6); margin-bottom: calc(var(--d) + 6px); }
.k--sm .k-face { min-height: 46px; padding: 10px 16px 10px 20px; gap: 10px; }
.k--sm .k-label { font-size: 14px; }

.k--cream {
  --face: linear-gradient(180deg, hsl(45 100% 97%), hsl(42 62% 90%) 60%, hsl(40 42% 82%));
  --side: linear-gradient(180deg, hsl(36 26% 60%), hsl(30 22% 42%));
}

/* Gametype tile: a big slab, cream at rest, its own colour once picked */
.k--mode {
  --d: calc(var(--depth) * 1.5);
  --cut: 2.2%;
  --face: linear-gradient(180deg, hsl(45 100% 97%), hsl(42 58% 89%) 62%, hsl(40 40% 80%));
  --side: linear-gradient(180deg, hsl(36 24% 56%), hsl(30 20% 38%));
  --shadow: hsla(250, 70%, 2%, 0.6);
}
.k--mode .k-face {
  min-height: 176px; padding: 18px 26px 22px 40px;
  flex-direction: column; align-items: stretch; justify-content: space-between;
}
.k--mode.is-picked {
  --press: -0.5;
  --face: linear-gradient(180deg, var(--a-hi), var(--a) 58%, var(--a-lo));
  --side: linear-gradient(180deg, var(--a-side-hi), var(--a-side-lo));
  --sub: hsla(250, 45%, 8%, 0.66);
}
.tile-band { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: var(--a); }
.k--mode.is-picked .tile-band { background: var(--a-side-hi); }
.tile-no { font: 800 13px/1 var(--display); letter-spacing: 0.14em; color: var(--sub); }
.tile-main { display: flex; flex-direction: column; gap: 8px; }
.tile-name { font: 900 clamp(28px, 2.6vw, 46px)/0.9 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.tile-sub { font: 700 14px/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--sub); }

/* The arcade key */
.k--cta {
  display: inline-block; width: auto;
  --d: calc(var(--depth) * 1.6);
  --cut: 5%;
  --face: linear-gradient(180deg, var(--a-hi), var(--a) 58%, var(--a-lo));
  --side: linear-gradient(180deg, var(--a-side-hi), var(--a-side-lo));
  --shadow: hsla(250, 70%, 3%, 0.62);
}
.k--cta .k-face { min-height: 90px; padding: 0 66px 0 60px; justify-content: center; }
.k--cta .k-label { font-size: 30px; letter-spacing: 0.1em; }

.k--util .k-face { justify-content: center; min-height: 40px; padding: 8px 10px; }
.k--util .k-label { font: 800 11px/1 var(--display); letter-spacing: 0.12em; }

.k--send { width: auto; flex: 0 0 auto; margin: 0 calc(var(--dx) + 2px) var(--d) 0; }
.k--send .k-face { min-height: 44px; padding: 0 22px 0 24px; }
.k--send .k-label { font-size: 13px; letter-spacing: 0.12em; }

/* ── States: order matters, later rules win ties ── */
.k:hover,
.k:focus-visible {
  --press: -0.35;
  --face: linear-gradient(180deg, hsl(278 92% 75%), hsl(273 80% 61%) 55%, hsl(268 72% 50%));
  --side: linear-gradient(180deg, hsl(266 72% 34%), hsl(258 72% 19%));
  --text: hsl(45 100% 96%);
  --sub: hsla(45, 100%, 96%, 0.72);
  --shadow: hsla(268, 80%, 14%, 0.5);
}
.k--mode.is-picked:hover,
.k--mode.is-picked:focus-visible {
  --press: -0.75;
  --face: linear-gradient(180deg, var(--a-hi), var(--a) 58%, var(--a-lo));
  --side: linear-gradient(180deg, var(--a-side-hi), var(--a-side-lo));
  --text: hsl(250 45% 8%);
  --sub: hsla(250, 45%, 8%, 0.66);
}
.k:active {
  --press: 1;
  --face: linear-gradient(180deg, hsl(272 76% 58%), hsl(266 70% 45%));
}
.k--mode.is-picked:active {
  --press: 1;
  --face: linear-gradient(180deg, var(--a), var(--a-lo));
}
.k:active .k-face { transition-duration: .05s; transition-timing-function: ease-out; }
.k:active { transition-duration: .05s; }

/* Current page: a latched key, pressed in and inked */
.k.is-on,
.k.is-on:hover,
.k.is-on:focus-visible,
.k.is-on:active {
  --press: 0.62;
  --face: linear-gradient(180deg, hsl(250 28% 21%), hsl(250 40% 10%) 60%, hsl(252 44% 6%));
  --side: linear-gradient(180deg, hsl(252 44% 5%), hsl(252 44% 3%));
  --text: var(--gold-text);
  --sub: hsla(46, 100%, 60%, 0.66);
}

/* ═══════════════════════════════ RAIL ═══════════════════════════════ */
.rail {
  position: relative; z-index: 2; flex: 0 0 var(--rail-w);
  display: flex; flex-direction: column;
  padding: 22px 0 18px;
  background:
    radial-gradient(120% 55% at 25% 0%, hsla(54, 100%, 78%, 0.55), transparent 62%),
    linear-gradient(172deg, hsl(46 100% 57%), hsl(41 96% 48%));
  clip-path: polygon(0 0, 100% 0, calc(100% - var(--rail-skew)) 100%, 0 100%);
  overflow: hidden;
}
.rail::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: 0; z-index: 3;
  width: calc(var(--rail-skew) + 8px);
  background: linear-gradient(180deg, hsl(276 90% 64%), hsl(262 75% 42%));
  clip-path: polygon(calc(100% - 8px) 0, 100% 0, calc(100% - var(--rail-skew)) 100%, calc(100% - var(--rail-skew) - 8px) 100%);
}
.rail > * { position: relative; z-index: 1; }
.rail-kanji {
  position: absolute !important; z-index: 0 !important; right: 12%; bottom: 17%;
  font: 400 clamp(180px, 19vw, 300px)/0.8 serif;
  color: hsla(30, 90%, 22%, 0.1); pointer-events: none; user-select: none;
}

.brand { padding: 0 calc(var(--rail-skew) + 16px) 16px 22px; }
.brand-logo {
  display: block; width: 100%; max-width: 420px; height: auto;
  filter: drop-shadow(0 6px 10px hsla(28, 90%, 14%, 0.35));
}

.rail-label {
  padding: 0 24px; margin: 6px 0 12px;
  font: 700 11px/1 var(--body); letter-spacing: 0.26em; text-transform: uppercase;
  color: hsla(250, 45%, 8%, 0.62);
}
.rail-keys { display: flex; flex-direction: column; padding: 0 calc(var(--rail-skew) + 18px) 0 22px; }

.live-dot {
  display: inline-block; width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%;
  background: hsl(322 100% 58%); box-shadow: 0 0 8px hsl(322 100% 58%);
}

.player {
  display: flex; align-items: center; gap: 12px;
  margin: 0 calc(var(--rail-skew) + 18px) 18px 22px; padding: 12px 16px;
  background: hsla(250, 45%, 7%, 0.92); color: var(--cream);
  clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
}
.player-avatar {
  width: 38px; height: 38px; flex: 0 0 38px;
  background: linear-gradient(135deg, hsl(182 95% 55%), var(--violet));
  clip-path: polygon(14% 0, 100% 8%, 88% 100%, 0 90%);
}
.player-name { font: 800 14px/1.2 var(--display); letter-spacing: 0.05em; }
.player-meta { font: 600 12px/1.2 var(--body); letter-spacing: 0.08em; color: hsla(45, 100%, 95%, 0.55); }

.util { flex-direction: row; gap: 10px; }
.util .k { flex: 1; width: auto; }

/* ═══════════════════════════════ STAGE ═══════════════════════════════ */
/* The stage slides under the rail's slanted edge (the rail sits above it), so the
   light and the backdrop word run up to the diagonal instead of stopping at the
   rail's rectangular box on a vertical line. */
.stage {
  flex: 1; min-width: 0; position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 22px;
  margin-left: calc(-1 * var(--rail-skew));
  padding: 30px 52px 24px calc(28px + var(--rail-skew));
}
.stage > :not(.fx):not(.ghost) { position: relative; z-index: 1; }

/* Drifting light: three blurred fields wandering slowly behind everything.
   Only transform animates, so the blur is rasterised once and moved. */
.fx { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb {
  position: absolute; top: 0; left: 0; border-radius: 50%;
  filter: blur(90px); will-change: transform;
}
.orb--accent {
  width: 640px; height: 640px; opacity: 0.24;
  background-color: var(--a);
  transition: background-color 1.4s ease;
  animation: drift-a 38s ease-in-out infinite alternate;
}
.orb--violet {
  width: 760px; height: 760px; opacity: 0.22;
  background-color: hsl(276 90% 56%);
  animation: drift-b 47s ease-in-out infinite alternate;
}
.orb--deep {
  width: 560px; height: 560px; opacity: 0.2;
  background-color: hsl(232 85% 52%);
  animation: drift-c 31s ease-in-out infinite alternate;
}
@keyframes drift-a {
  0%   { transform: translate(40vw, -20vh) scale(1); }
  30%  { transform: translate(16vw, 20vh) scale(1.15); }
  65%  { transform: translate(44vw, 36vh) scale(0.9); }
  100% { transform: translate(6vw, 2vh) scale(1.05); }
}
@keyframes drift-b {
  0%   { transform: translate(-14vw, 34vh) scale(1); }
  35%  { transform: translate(26vw, 54vh) scale(1.1); }
  70%  { transform: translate(40vw, 4vh) scale(0.95); }
  100% { transform: translate(2vw, 44vh) scale(1.08); }
}
@keyframes drift-c {
  0%   { transform: translate(48vw, 52vh) scale(1); }
  40%  { transform: translate(20vw, 62vh) scale(1.2); }
  75%  { transform: translate(4vw, 18vh) scale(0.9); }
  100% { transform: translate(34vw, 28vh) scale(1); }
}

/* The mode name, huge and hollow, bleeding off the bottom-left */
.ghost {
  position: absolute; z-index: 0; left: -1%; bottom: -4%;
  font: 900 clamp(200px, 25vw, 440px)/0.78 var(--display); letter-spacing: -0.04em;
  white-space: nowrap; color: transparent;
  -webkit-text-stroke: 2px color-mix(in srgb, var(--a) 26%, transparent);
  pointer-events: none; user-select: none;
}

/* ═══════════════════════════════ ROOM ═══════════════════════════════ */
:root {
  --you: hsl(322 95% 62%);      /* your side is pink, whatever its name */
  --them: hsl(182 95% 52%);     /* theirs is cyan */
  --go: hsl(96 85% 55%);        /* ready */
  --danger: hsl(356 88% 56%);
}
.stage { gap: 20px; }
.ghost { bottom: -7%; }

/* ── Top bar: which room this is, and how to bring people in ── */
.room-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.room-id { display: flex; align-items: center; gap: 18px; min-width: 0; }
.mode-chip {
  padding: 10px 26px 10px 22px;
  background: linear-gradient(180deg, var(--a-hi), var(--a) 60%, var(--a-lo)); color: var(--ink);
  font: 900 26px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
  clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
  transition: background .6s ease;
}
.room-meta { font: 700 14px/1.3 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.6); }
.room-meta b { color: var(--cream); font-family: var(--display); font-weight: 800; letter-spacing: 0.08em; }

.invite { display: flex; align-items: center; gap: 12px; }
.invite-label { font: 700 12px/1 var(--body); letter-spacing: 0.26em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.5); }
.invite-url {
  padding: 13px 18px; background: hsla(250, 44%, 5%, 0.8); color: var(--cream);
  border: 1.5px solid hsla(276, 90%, 64%, 0.3);
  font: 700 15px/1 var(--display); letter-spacing: 0.04em; white-space: nowrap;
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  user-select: all;
}
.k--copy { width: auto; margin: 0 calc(var(--dx) + 2px) var(--d) 0; }
.k--copy .k-face { min-height: 44px; padding: 0 22px 0 24px; }

/* ── Matchmaking status: always on screen, always moving while it waits ── */
.status {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 28px;
  padding: 20px 34px 26px 24px;
  background: linear-gradient(100deg, color-mix(in srgb, var(--a) 16%, hsl(250 40% 10%)), hsla(250, 44%, 7%, 0.92) 55%);
  border-left: 10px solid var(--a);
  clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
  overflow: hidden; isolation: isolate;
  transition: border-color .6s ease;
}
/* A light band sweeping across the slab while nobody has turned up yet */
.status::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--a) 14%, transparent) 50%, transparent 70%);
  transform: translateX(-100%);
  animation: sweep 3.2s ease-in-out infinite;
}
.status[data-phase="ready"]::before { animation-duration: 1.6s; }
.status[data-phase="starting"]::before { animation-duration: 0.9s; }
@keyframes sweep { to { transform: translateX(100%); } }

.radar {
  position: relative; width: 104px; height: 104px; flex: 0 0 104px;
  border-radius: 50%;
  background: radial-gradient(circle, hsla(250, 44%, 5%, 0.9) 60%, hsla(250, 44%, 5%, 0.4));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--a) 55%, transparent);
}
.radar-ring { position: absolute; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--a) 35%, transparent); }
.radar-ring.r1 { inset: 18px; }
.radar-ring.r2 { inset: 36px; }
.radar-sweep {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 70%, color-mix(in srgb, var(--a) 85%, transparent) 100%);
  animation: spin 2.2s linear infinite;
}
.radar-blip {
  position: absolute; width: 9px; height: 9px; border-radius: 50%; top: 24px; left: 66px;
  background: var(--a-hi); box-shadow: 0 0 10px var(--a);
  opacity: 0; animation: blip 2.2s linear infinite;
}
.radar-blip.b2 { top: 62px; left: 22px; animation-delay: -1.3s; }
.radar-core {
  position: absolute; inset: 45px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--a); color: var(--ink);
  font: 900 34px/1 var(--display);
  transition: inset .35s cubic-bezier(.2, .9, .3, 1.3);
}
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes blip { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 80%, 100% { opacity: 0; } }

/* Found: the sweep stops and the core swells into a signal that pulses outward */
.status[data-phase="ready"] .radar-sweep,
.status[data-phase="ready"] .radar-blip { display: none; }
.status[data-phase="ready"] .radar-core { inset: 16px; }
.status[data-phase="ready"] .radar-ring { inset: 16px; border: 3px solid var(--a); animation: ping 1.4s ease-out infinite; }
.status[data-phase="ready"] .radar-ring.r2 { animation-delay: .7s; }
@keyframes ping { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.55); opacity: 0; } }

/* Starting: everything locked, the sweep goes fast */
.status[data-phase="starting"] .radar-sweep { animation-duration: .7s; }
.status[data-phase="starting"] .radar-blip { display: none; }
.status[data-phase="starting"] .radar-core { inset: 30px; }

.status-kicker { font: 700 12px/1 var(--body); letter-spacing: 0.32em; text-transform: uppercase; color: var(--a); }
.status-head {
  margin-top: 8px;
  font: 900 clamp(26px, 2.6vw, 46px)/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--cream); text-shadow: 4px 5px 0 hsl(250 50% 3%);
}
.status[data-phase="ready"] .status-head { color: var(--a-hi); }
.dots i { font-style: normal; animation: dot 1.4s steps(1) infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%, 20% { opacity: 0; } 21%, 100% { opacity: 1; } }
.status[data-phase="ready"] .dots { display: none; }
.status-sub { margin-top: 10px; font: 600 19px/1.25 var(--body); color: hsla(45, 100%, 95%, 0.78); }
.status-sub b { color: var(--cream); font-weight: 700; }

.status-count { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.count { font: 900 60px/0.9 var(--display); color: var(--cream); font-variant-numeric: tabular-nums; }
.count .of { font-size: 28px; color: hsla(45, 100%, 95%, 0.42); }
.clock { font: 700 13px/1 var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.5); font-variant-numeric: tabular-nums; }

/* Progress: stripes crawl while waiting, the fill is how close the room is to starting */
.status-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: hsla(0, 0%, 100%, 0.06); overflow: hidden; }
.status-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background:
    repeating-linear-gradient(-45deg, transparent 0 10px, hsla(250, 60%, 5%, 0.28) 10px 20px),
    linear-gradient(90deg, var(--a-lo), var(--a-hi));
  background-size: 28px 28px, 100% 100%;
  animation: crawl .8s linear infinite;
  transition: width .6s cubic-bezier(.2, .9, .3, 1);
}
@keyframes crawl { to { background-position: 28px 0, 0 0; } }
.status[data-phase="starting"] .status-fill { width: 35% !important; animation: crawl .8s linear infinite, shuttle 1.1s ease-in-out infinite alternate; }
@keyframes shuttle { from { left: -35%; } to { left: 100%; } }

/* ── Roster ── */
.roster { display: grid; gap: 14px 22px; align-items: stretch; }
.roster--vs    { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.roster--ffa   { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.roster--teams { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
.team { display: flex; flex-direction: column; gap: 8px; }
.team-head {
  display: flex; align-items: baseline; gap: 12px; padding: 0 4px 4px;
  font: 900 18px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--c);
}
.team-head .mine { font: 700 11px/1 var(--body); letter-spacing: 0.22em; color: hsla(45, 100%, 95%, 0.55); }
.team-head .n { margin-left: auto; font: 800 15px/1 var(--display); color: hsla(45, 100%, 95%, 0.7); }

.vs {
  align-self: center; padding: 0 6px;
  font: 900 clamp(40px, 3.6vw, 64px)/1 var(--display); letter-spacing: -0.02em;
  color: var(--gold-text); text-shadow: 5px 6px 0 hsl(250 50% 3%);
  transform: skewX(-10deg);
}
.roster--teams .vs { font-size: 34px; }

.seat {
  --c: var(--them);
  position: relative; display: flex; align-items: center; gap: 14px; min-width: 0;
  min-height: 46px; padding: 8px 18px 8px 16px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 24%, hsl(250 40% 9%)), hsla(250, 44%, 7%, 0.92) 70%);
  border-left: 5px solid var(--c);
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  overflow: hidden;
}
.seat--new { animation: seat-in .45s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes seat-in { from { transform: translateX(-24px); opacity: 0; } }
.seat-avatar {
  width: 30px; height: 30px; flex: 0 0 30px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 40%, var(--violet)));
  color: var(--ink); font: 900 14px/1 var(--display);
  clip-path: polygon(14% 0, 100% 8%, 88% 100%, 0 90%);
}
.seat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 800 16px/1.1 var(--display); letter-spacing: 0.04em; color: var(--cream); }
.seat-tag {
  flex: 0 0 auto; padding: 3px 8px; font: 900 10px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase;
  background: hsla(0, 0%, 100%, 0.1); color: hsla(45, 100%, 95%, 0.7);
  clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
}
.seat-tag--you { background: var(--gold-text); color: var(--ink); }
.seat-state {
  flex: 0 0 auto; padding: 5px 11px; font: 900 11px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase;
  color: hsla(45, 100%, 95%, 0.42); box-shadow: inset 0 0 0 1.5px hsla(45, 100%, 95%, 0.2);
  clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}
.seat.is-ready .seat-state { background: var(--go); color: var(--ink); box-shadow: none; }

/* Empty seat: hatched, with a shimmer running through it while the room searches */
.seat--open {
  --c: hsla(45, 100%, 95%, 0.22);
  background: repeating-linear-gradient(-45deg, hsla(0, 0%, 100%, 0.035) 0 10px, transparent 10px 20px), hsla(250, 44%, 6%, 0.55);
  border-left-style: dashed;
}
.seat--open .seat-avatar { background: hsla(0, 0%, 100%, 0.07); color: hsla(45, 100%, 95%, 0.45); animation: q 1.6s ease-in-out infinite; }
.seat--open .seat-name { font-family: var(--body); font-weight: 700; font-style: italic; letter-spacing: 0.1em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.4); }
.seat--open::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--a) 18%, transparent) 50%, transparent 65%);
  transform: translateX(-100%); animation: sweep 2.4s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .18s);
}
[data-phase="starting"] .seat--open::after { display: none; }
@keyframes q { 50% { transform: scale(0.84); opacity: 0.55; } }

/* 1 v 1: two big cards facing each other */
.roster--vs .seat { min-height: 116px; gap: 20px; padding: 16px 30px 16px 22px; border-left-width: 8px; clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); }
.roster--vs .seat-avatar { width: 76px; height: 76px; flex-basis: 76px; font-size: 34px; }
.roster--vs .seat-name { font-size: clamp(22px, 2vw, 34px); font-weight: 900; }
.roster--vs .seat--open .seat-name { font-size: clamp(18px, 1.5vw, 24px); }
.roster--vs .seat-state { padding: 8px 14px; font-size: 13px; }
/* Free for all: four across, so the name gets the row and the state goes under it */
.roster--ffa .seat {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-content: center;
  column-gap: 12px; row-gap: 5px; min-height: 62px;
}
.roster--ffa .seat-avatar { grid-row: 1 / 3; width: 36px; height: 36px; }
.roster--ffa .seat-name { grid-column: 2; grid-row: 1; }
.roster--ffa .seat--open .seat-name { grid-row: 1 / 3; align-self: center; }
.roster--ffa .seat-tag { grid-column: 3; grid-row: 1; }
.roster--ffa .seat-state { grid-column: 2 / 4; grid-row: 2; justify-self: start; padding: 0; box-shadow: none; clip-path: none; font-size: 10px; }
.roster--ffa .seat.is-ready .seat-state { background: none; color: var(--go); }

/* ── Map vote ── */
.vote { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.vote-head { display: flex; align-items: baseline; gap: 18px; }
.vote-title { font: 900 20px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream); }
.vote-hint { font: 700 13px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.48); }
.maps { flex: 1; min-height: 150px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 26px; }

.k--map {
  --d: calc(var(--depth) * 1.3);
  --cut: 2.4%;
  --face: linear-gradient(180deg, hsl(45 100% 97%), hsl(42 58% 89%) 62%, hsl(40 40% 80%));
  --side: linear-gradient(180deg, hsl(36 24% 56%), hsl(30 20% 38%));
  --shadow: hsla(250, 70%, 2%, 0.6);
  height: calc(100% - var(--d) - 8px);
}
.k--map .k-face { height: 100%; min-height: 0; padding: 0; flex-direction: column; align-items: stretch; gap: 0; }
.map-shot { position: relative; flex: 1; min-height: 60px; overflow: hidden; background: hsl(250 30% 14%); }
.map-img {
  position: absolute; inset: 0; background: var(--img) center / cover no-repeat;
  transition: transform .5s cubic-bezier(.2, .9, .3, 1), filter .5s ease;
}
.map-shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, hsla(250, 50%, 4%, 0.55)); }
.k--map:hover .map-img, .k--map:focus-visible .map-img { transform: scale(1.06); }
.map-flags { position: absolute; z-index: 1; top: 12px; left: 22px; display: flex; gap: 8px; }
.flag {
  padding: 6px 12px; font: 900 11px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--ink); color: var(--gold-text);
  clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}
.flag--you { background: var(--a); color: var(--ink); }
.flag--win { background: var(--go); color: var(--ink); }
.map-votes {
  position: absolute; z-index: 1; right: 18px; bottom: 8px;
  font: 900 46px/1 var(--display); color: var(--cream); text-shadow: 3px 4px 0 hsl(250 50% 3%);
  font-variant-numeric: tabular-nums;
}
.map-votes small { font-size: 14px; letter-spacing: 0.14em; margin-left: 8px; color: hsla(45, 100%, 95%, 0.7); }
.map-info { display: flex; align-items: center; gap: 12px; padding: 13px 26px 15px 22px; }
.map-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 900 clamp(16px, 1.3vw, 22px)/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.map-id { font: 700 13px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); }

.k--map.is-picked {
  --press: -0.5;
  --face: linear-gradient(180deg, var(--a-hi), var(--a) 58%, var(--a-lo));
  --side: linear-gradient(180deg, var(--a-side-hi), var(--a-side-lo));
  --sub: hsla(250, 45%, 8%, 0.66);
}
.k--map.is-picked:hover, .k--map.is-picked:focus-visible {
  --press: -0.75;
  --face: linear-gradient(180deg, var(--a-hi), var(--a) 58%, var(--a-lo));
  --side: linear-gradient(180deg, var(--a-side-hi), var(--a-side-lo));
  --text: hsl(250 45% 8%); --sub: hsla(250, 45%, 8%, 0.66);
}
.k--map.is-picked:active { --press: 1; --face: linear-gradient(180deg, var(--a), var(--a-lo)); }
.k--map.is-out { opacity: 0.32; }
.k--map.is-out .map-img { filter: grayscale(1); }

/* ── Actions ── */
.actions { display: flex; align-items: flex-end; gap: clamp(12px, 1.1vw, 20px); }
.actions .spacer { flex: 1; }
.k--act { width: auto; flex: 0 0 auto; margin-bottom: var(--d); --d: calc(var(--depth) * 1.2); }
.k--act .k-face {
  min-height: 66px; padding: 0 clamp(18px, 1.7vw, 32px) 0 clamp(20px, 1.8vw, 34px);
  flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px;
}
.k--act .k-label { font-size: clamp(14px, 1vw, 18px); }
.k--act .k-hint { font-size: 12px; }

.k--leave { --text: var(--danger); --sub: hsla(356, 70%, 38%, 0.7); }
.k--leave:hover, .k--leave:focus-visible {
  --face: linear-gradient(180deg, hsl(356 95% 68%), hsl(356 85% 54%) 55%, hsl(352 80% 44%));
  --side: linear-gradient(180deg, hsl(350 75% 30%), hsl(345 72% 18%));
  --shadow: hsla(350, 80%, 14%, 0.5);
}
.k--leave:active { --face: linear-gradient(180deg, hsl(356 80% 52%), hsl(352 78% 40%)); }

.k--ready {
  --d: calc(var(--depth) * 1.7);
  --cut: 5%;
  --face: linear-gradient(180deg, var(--a-hi), var(--a) 58%, var(--a-lo));
  --side: linear-gradient(180deg, var(--a-side-hi), var(--a-side-lo));
  --shadow: hsla(250, 70%, 3%, 0.62);
  --sub: hsla(250, 45%, 8%, 0.62);
  width: auto; flex: 0 0 auto; margin: 0 calc(var(--dx) + 4px) var(--d) 0;
}
.k--ready .k-face {
  min-width: clamp(230px, 17vw, 330px); min-height: 100px; padding: 0 clamp(34px, 3.3vw, 64px) 0 clamp(30px, 3vw, 58px);
  flex-direction: column; justify-content: center; gap: 8px;
}
.k--ready .k-label { font-size: clamp(26px, 1.9vw, 36px); letter-spacing: 0.12em; }
.k--ready .k-hint { font-size: 13px; }
/* Latched: pressed in and inked, lit in the mode's colour */
.k--ready.is-on, .k--ready.is-on:hover, .k--ready.is-on:focus-visible, .k--ready.is-on:active {
  --text: var(--a-hi); --sub: color-mix(in srgb, var(--a-hi) 66%, transparent);
}
/* Calling for you: a glow breathing behind the key when the room waits on you */
.k--ready::before {
  content: ""; position: absolute; inset: -10px -14px; z-index: -1;
  background: var(--a); filter: blur(18px); opacity: 0;
  clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
}
.k--ready.is-calling::before { animation: call 1.1s ease-in-out infinite; }
@keyframes call { 50% { opacity: 0.75; } }

.k:disabled { pointer-events: none; opacity: 0.36; }
a.k { text-decoration: none; }

/* ═══════════════════════════════ RAIL: ROOM CHAT ═══════════════════════════════ */
.room-chat {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  margin: 4px calc(var(--rail-skew) + 18px) 16px 22px; padding: 14px 16px 14px 18px;
  background: hsla(250, 45%, 7%, 0.93); color: var(--cream);
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
}
.room-chat .chat-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid hsla(276, 90%, 64%, 0.22);
}
.chat-title { font: 900 13px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-text); }
.chat-online { display: inline-flex; align-items: center; gap: 8px; font: 700 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.55); }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 4px 4px 0; scrollbar-width: thin; scrollbar-color: hsla(276, 90%, 64%, 0.45) transparent; }
.msg { display: grid; grid-template-columns: 38px auto 1fr; gap: 10px; align-items: baseline; padding: 5px 6px 5px 2px; font: 600 15px/1.3 var(--body); color: hsla(45, 100%, 95%, 0.9); }
.msg .t { font: 700 11px/1 var(--body); letter-spacing: 0.06em; color: hsla(45, 100%, 95%, 0.3); }
.msg .who { font: 800 12px/1 var(--display); letter-spacing: 0.04em; color: var(--c, var(--them)); white-space: nowrap; }
.msg--me { background: linear-gradient(90deg, hsla(46, 100%, 60%, 0.1), transparent 70%); }
.msg--me .who { color: var(--gold-text); }
.msg--sys { grid-template-columns: 38px 1fr; font-size: 14px; font-style: italic; color: hsla(45, 100%, 95%, 0.48); }
.msg--sys .txt::before { content: "◆  "; font-style: normal; color: hsl(276 90% 72%); }
.msg--new { animation: msg-in .22s ease-out; }
@keyframes msg-in { from { opacity: 0; transform: translateY(8px); } }
.chat-form { display: flex; align-items: center; gap: 12px; padding-top: 10px; margin-top: 4px; border-top: 1px solid hsla(276, 90%, 64%, 0.22); }
.chat-input {
  flex: 1; min-width: 0; height: 40px; padding: 0 14px;
  background: hsla(250, 44%, 4%, 0.9); color: var(--cream);
  border: 1.5px solid hsla(276, 90%, 64%, 0.28); outline: none; font: 600 15px/1 var(--body);
  clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
}
.chat-input::placeholder { color: hsla(45, 100%, 95%, 0.38); }
.chat-input:focus { border-color: var(--violet); }
.k--send { width: auto; flex: 0 0 auto; margin: 0 calc(var(--dx) + 2px) var(--d) 0; }
.k--send .k-face { min-height: 40px; padding: 0 16px 0 18px; }
.k--send .k-label { font-size: 12px; letter-spacing: 0.12em; }

/* Short screens: tighten the chrome so the map shots keep their height */
@media (max-height: 960px) {
  .stage { gap: 14px; padding-top: 22px; padding-bottom: 16px; }
  .status { padding: 14px 30px 20px 20px; gap: 22px; }
  .radar { zoom: 0.8; }
  .status-head { font-size: clamp(24px, 2.2vw, 38px); }
  .status-sub { margin-top: 6px; font-size: 17px; }
  .count { font-size: 50px; }
  .roster--vs .seat { min-height: 92px; }
  .roster--teams .seat { min-height: 38px; padding-top: 5px; padding-bottom: 5px; }
  .team { gap: 6px; }
  .k--ready .k-face { min-height: 84px; }
  .k--act .k-face { min-height: 58px; }
}

/* ═══════════════════════════════ PROTOTYPE CONTROLS ═══════════════════════════════ */
/* The ground toggle stays out; the rest folds to a tab so it never covers the page */
.proto {
  position: fixed; z-index: 50; top: 0; left: 63%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; padding: 5px 10px; outline: none;
  background: hsla(250, 45%, 4%, 0.9); border: 1px solid hsla(276, 90%, 64%, 0.4);
  font: 700 11px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: hsla(45, 100%, 95%, 0.45);
}
.proto-tab { color: hsl(276 90% 76%); }
.proto-body { display: none; align-items: center; gap: 4px; margin-left: 8px; }
.proto:hover .proto-body, .proto:focus-within .proto-body { display: flex; }
.proto .sep { width: 1px; height: 18px; margin: 0 8px; background: hsla(276, 90%, 64%, 0.35); }
.proto button {
  padding: 5px 9px; border: 0; background: none; cursor: pointer;
  font: inherit; letter-spacing: 0.1em; color: hsla(45, 100%, 95%, 0.7);
}
.proto button:hover { color: var(--cream); background: hsla(276, 90%, 64%, 0.25); }
.proto button.is-on { background: var(--gold-text); color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .k, .k-face, .map-img { transition: none; }
  .orb, .msg--new, .seat--new, .status::before, .seat--open::after,
  .radar-sweep, .radar-blip, .radar-ring, .dots i, .status-fill, .k--ready::before, .seat--open .seat-avatar { animation: none !important; }
}
</style>
</head>

<body>
<div class="proto" aria-label="Prototype controls" tabindex="0">
  <span class="proto-tab">Proto ▾</span>
  <div class="proto-body">
    Mode
    <button data-mode="duel">Duel</button><button data-mode="amphi">Amphi</button><button data-mode="ffa">FFA</button><button data-mode="snd">S&amp;D</button>
    <span class="sep"></span>
    Room
    <button data-preset="searching">Searching</button><button data-preset="found">Found</button><button data-preset="starting">All ready</button>
  </div>
</div>

<div class="shell">

  <nav class="rail">
    <div class="rail-kanji">闘</div>

    <div class="brand"><img class="brand-logo" src="/data/washoi.png" alt="Washiki Washoi" /></div>

    <div class="rail-keys">
      <a class="k k--nav is-on" href="lobby-3d.html">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">Play</span><span class="k-hint">In lobby</span></span>
      </a>
      <a class="k k--nav" href="leaderboard.html">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">Leaderboard</span><span class="k-hint">Top players</span></span>
      </a>
      <a class="k k--nav" href="demos.html">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">Demos</span><span class="k-hint">Replays</span></span>
      </a>
    </div>

    <section class="room-chat" aria-label="Room chat">
      <div class="chat-head">
        <span class="chat-title">Room chat</span>
        <span class="chat-online"><span class="live-dot"></span><span id="hereCount">1 here</span></span>
      </div>
      <div class="chat-log" id="chatLog"></div>
      <form class="chat-form" id="chatForm">
        <input class="chat-input" id="chatInput" placeholder="Say something…" autocomplete="off" />
        <button class="k k--sm k--send" type="submit"><span class="k-side"></span><span class="k-face"><span class="k-label">Send</span></span></button>
      </form>
    </section>

    <div class="player">
      <div class="player-avatar"></div>
      <div><div class="player-name" id="playerName">sundflux</div><div class="player-meta" id="playerMeta">In Duel lobby</div></div>
    </div>

    <div class="rail-keys util">
      <button class="k k--sm k--util"><span class="k-side"></span><span class="k-face"><span class="k-label">Profile</span></span></button>
      <button class="k k--sm k--util"><span class="k-side"></span><span class="k-face"><span class="k-label">Settings</span></span></button>
      <button class="k k--sm k--util"><span class="k-side"></span><span class="k-face"><span class="k-label">Console</span></span></button>
    </div>
  </nav>

  <main class="stage" id="stage">
    <div class="fx" aria-hidden="true">
      <div class="orb orb--violet"></div>
      <div class="orb orb--deep"></div>
      <div class="orb orb--accent"></div>
    </div>
    <div class="ghost" id="ghost" aria-hidden="true">DUEL</div>

    <header class="room-top">
      <div class="room-id">
        <span class="mode-chip" id="modeChip">Duel</span>
        <span class="room-meta"><span id="modeSub">1 vs 1</span><br />Lobby <b>k7f3q2</b></span>
      </div>
      <div class="invite">
        <span class="invite-label">Invite</span>
        <span class="invite-url">washoi.gg/lobby/k7f3q2</span>
        <button class="k k--sm k--cream k--copy" id="copyBtn"><span class="k-side"></span><span class="k-face"><span class="k-label" id="copyLabel">Copy</span></span></button>
      </div>
    </header>

    <section class="status" id="status" data-phase="searching" aria-live="polite">
      <div class="radar" aria-hidden="true">
        <span class="radar-ring r1"></span><span class="radar-ring r2"></span>
        <span class="radar-sweep"></span>
        <span class="radar-blip"></span><span class="radar-blip b2"></span>
        <span class="radar-core" id="radarCore"></span>
      </div>
      <div>
        <div class="status-kicker" id="statusKicker">Matchmaking</div>
        <div class="status-head"><span id="statusHead">Searching for opponent</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
        <div class="status-sub" id="statusSub"></div>
      </div>
      <div class="status-count">
        <div class="count"><span id="countNow">1</span><span class="of">/<span id="countMax">2</span></span></div>
        <div class="clock" id="clock">Waiting 0:00</div>
      </div>
      <div class="status-bar"><span class="status-fill" id="statusFill"></span></div>
    </section>

    <section class="roster" id="roster" aria-label="Players"></section>

    <section class="vote">
      <div class="vote-head">
        <span class="vote-title">Vote map</span>
        <span class="vote-hint">Most votes wins · ties are random</span>
      </div>
      <div class="maps" id="maps"></div>
    </section>

    <div class="actions">
      <a class="k k--act k--cream k--leave" href="lobby-3d.html">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">← Leave</span><span class="k-hint">Back to play</span></span>
      </a>
      <button class="k k--act k--cream" id="addBot">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">+ Add bot</span><span class="k-hint" id="addBotHint">Fill a seat</span></span>
      </button>
      <button class="k k--act k--cream" id="switchSide">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">⇄ Switch</span><span class="k-hint" id="switchHint">To Udon</span></span>
      </button>
      <button class="k k--act k--cream" id="shuffle">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label">⤨ Shuffle</span><span class="k-hint" id="shuffleHint">Vote · 0 / 1</span></span>
      </button>
      <span class="spacer"></span>
      <button class="k k--ready" id="ready">
        <span class="k-side"></span>
        <span class="k-face"><span class="k-label" id="readyLabel">Ready</span><span class="k-hint" id="readyHint">Click when set</span></span>
      </button>
    </div>
  </main>
</div>

<script>
  // Room rules as the lobby server applies them (src/lobby/LobbyServer.ts): a room
  // starts once `min` players are in (min defaults to max) and every one of them is
  // ready; team rooms also need somebody on each side. Map names match the current
  // lobby; the Amphi ones are placeholders.
  const MODES = {
    duel:  { name: "Duel",  sub: "1 vs 1", max: 2, min: 2, layout: "vs",
             accent: ["hsl(182 95% 52%)", "hsl(182 100% 74%)", "hsl(188 90% 40%)", "hsl(192 85% 28%)", "hsl(198 80% 17%)"],
             maps: [["wdm2", "Proving Grounds"], ["acidwdm2", "Acid Warehouse"], ["wdm17", "Le Toxiquet"]] },
    amphi: { name: "Amphi", sub: "1 vs 1 · 3 min rounds", max: 2, min: 2, layout: "vs",
             accent: ["hsl(100 85% 52%)", "hsl(98 95% 72%)", "hsl(108 80% 40%)", "hsl(115 70% 26%)", "hsl(125 65% 16%)"],
             maps: [["wamphi1", "Amphitheatre"], ["wda1", "Arena One"], ["wda2", "Arena Two"]] },
    ffa:   { name: "FFA",   sub: "Free for all · 8 players", max: 8, min: 8, layout: "ffa",
             accent: ["hsl(46 100% 57%)", "hsl(51 100% 73%)", "hsl(41 100% 48%)", "hsl(34 90% 36%)", "hsl(28 85% 23%)"],
             maps: [["wdm14", "Aerowalk"], ["wdm5", "Sinister"], ["wdm7", "Brimstone"]] },
    snd:   { name: "S&D",   sub: "Up to 5 vs 5 · starts at 2", max: 10, min: 2, layout: "teams", teams: true,
             accent: ["hsl(322 95% 62%)", "hsl(322 100% 77%)", "hsl(318 85% 50%)", "hsl(312 70% 33%)", "hsl(306 70% 21%)"],
             maps: [["wbomb6", "Depot"], ["wbomb2", "Reactors"]] },
  };
  const ACCENT_VARS = ["--a", "--a-hi", "--a-lo", "--a-side-hi", "--a-side-lo"];
  const TEAM_NAME = { alpha: "Udon", bravo: "Soba" };
  // The name picked on the welcome page, if there is one
  const ME = (() => {
    try { return JSON.parse(localStorage.getItem("proto-player"))?.name || "sundflux"; } catch { return "sundflux"; }
  })();
  const SHARE_URL = "washoi.gg/lobby/k7f3q2";

  const CAST = {
    Nova: "hsl(182 95% 62%)", Reaper: "hsl(322 95% 70%)", Shadow: "hsl(125 70% 62%)", Fury: "hsl(276 90% 76%)",
    Titan: "hsl(28 100% 64%)", Storm: "hsl(200 90% 68%)", Wraith: "hsl(350 90% 70%)", Eclipse: "hsl(52 100% 64%)",
  };

  // Each preset: [name, team, ready, vote as a map index] — the players the room would hold
  const PRESETS = {
    vs: {
      searching: [[ME, "ffa", false, null]],
      found:     [[ME, "ffa", false, null], ["Nova", "ffa", true, 1]],
      starting:  [[ME, "ffa", true, 1], ["Nova", "ffa", true, 1]],
    },
    ffa: {
      searching: [[ME, "ffa", false, null], ["Titan", "ffa", true, 2], ["Storm", "ffa", false, 0], ["Fury", "ffa", true, 2]],
      found:     [[ME, "ffa", false, null], ["Titan", "ffa", true, 2], ["Storm", "ffa", false, 0], ["Fury", "ffa", true, 2],
                  ["Nova", "ffa", true, 1], ["Reaper", "ffa", false, 2], ["Shadow", "ffa", true, 0], ["Eclipse", "ffa", true, null]],
      starting:  [[ME, "ffa", true, 2], ["Titan", "ffa", true, 2], ["Storm", "ffa", true, 0], ["Fury", "ffa", true, 2],
                  ["Nova", "ffa", true, 1], ["Reaper", "ffa", true, 2], ["Shadow", "ffa", true, 0], ["Eclipse", "ffa", true, null]],
    },
    teams: {
      searching: [[ME, "bravo", false, null], ["Shadow", "bravo", true, 0]],
      found:     [[ME, "bravo", false, null], ["Shadow", "bravo", true, 0], ["Fury", "bravo", false, 1],
                  ["Reaper", "alpha", true, 0], ["Nova", "alpha", true, 1], ["Titan", "alpha", false, 0]],
      starting:  [[ME, "bravo", true, 0], ["Shadow", "bravo", true, 0], ["Fury", "bravo", true, 1], ["Wraith", "bravo", true, 0],
                  ["Reaper", "alpha", true, 0], ["Nova", "alpha", true, 1], ["Titan", "alpha", true, 0], ["Storm", "alpha", true, 1]],
    },
  };
  const CHATTER = {
    vs:    [["Nova", "glhf"], [ME, "hf, rail's mine"]],
    ffa:   [["Titan", "finally some bodies"], ["Storm", "brimstone or riot"], ["Fury", "no GL spam this time Storm"]],
    teams: [["Shadow", "i'll hold B"], ["Reaper", "rush A every round, bet"], ["Fury", "who grabs the bomb first?"]],
  };

  let modeKey = "duel";
  let preset = "searching";
  let players = [];
  let winner = null;          // decided once, when the room locks
  let shuffleVotes = new Set();
  let botCount = 0;
  let startedAt = Date.now();
  const shown = new Set();    // seats already on screen, so only newcomers animate in

  const mode = () => MODES[modeKey];
  const me = () => players.find((p) => p.name === ME);
  const humans = () => players.filter((p) => !p.bot);
  const onTeam = (t) => players.filter((p) => p.team === t);
  const el = (tag, className = "", text = "") => Object.assign(document.createElement(tag), { className, textContent: text });

  function phaseOf() {
    const m = mode();
    const sidesOk = !m.teams || (onTeam("alpha").length > 0 && onTeam("bravo").length > 0);
    if (players.length < m.min || !sidesOk) return "searching";
    return players.every((p) => p.ready) ? "starting" : "ready";
  }

  function voteCounts() {
    const counts = new Map(mode().maps.map(([id]) => [id, 0]));
    for (const p of players) if (p.vote) counts.set(p.vote, counts.get(p.vote) + 1);
    return counts;
  }

  // Most votes wins, random tiebreak — as the server resolves it
  function pickWinner() {
    const counts = voteCounts();
    const top = Math.max(...counts.values());
    const tied = [...counts].filter(([, n]) => n === top).map(([id]) => id);
    return tied[Math.floor(Math.random() * tied.length)];
  }
  const mapName = (id) => mode().maps.find(([m]) => m === id)[1];

  // ── Rendering ──
  function seat(p, color, i) {
    const s = el("div", "seat");
    s.style.setProperty("--i", i);
    if (!p) {
      s.classList.add("seat--open");
      s.append(el("span", "seat-avatar", "?"), el("span", "seat-name", mode().layout === "vs" ? "Searching…" : "Open"));
      return s;
    }
    s.style.setProperty("--c", color);
    s.classList.toggle("is-ready", p.ready);
    if (!shown.has(p.id)) s.classList.add("seat--new");
    s.append(el("span", "seat-avatar", p.bot ? "⚙" : p.name[0].toUpperCase()), el("span", "seat-name", p.name));
    if (p.name === ME) s.append(el("span", "seat-tag seat-tag--you", "You"));
    if (p.bot) s.append(el("span", "seat-tag", "Bot"));
    s.append(el("span", "seat-state", p.ready ? "✓ Ready" : "Not ready"));
    return s;
  }

  function renderRoster() {
    const m = mode();
    const roster = document.getElementById("roster");
    roster.className = `roster roster--${m.layout}`;
    const nodes = [];
    if (m.layout === "vs") {
      const other = players.find((p) => p.name !== ME);
      nodes.push(seat(me(), "var(--you)", 0), el("div", "vs", "VS"), seat(other, "var(--them)", 1));
    } else if (m.layout === "ffa") {
      for (let i = 0; i < m.max; i++) {
        const p = players[i];
        nodes.push(seat(p, p && (p.name === ME ? "var(--you)" : CAST[p.name] || "hsl(250 20% 70%)"), i));
      }
    } else {
      // Your side on the left and pink, whichever name it has
      const mine = me().team;
      const per = m.max / 2;
      for (const [team, color] of [[mine, "var(--you)"], [mine === "alpha" ? "bravo" : "alpha", "var(--them)"]]) {
        const col = el("div", "team");
        col.style.setProperty("--c", color);
        const head = el("div", "team-head", `Team ${TEAM_NAME[team]}`);
        if (team === mine) head.append(el("span", "mine", "Your side"));
        head.append(el("span", "n", `${onTeam(team).length} / ${per}`));
        col.append(head);
        const members = onTeam(team);
        for (let i = 0; i < per; i++) col.append(seat(members[i], color, i));
        nodes.push(col);
        if (team === mine) nodes.push(el("div", "vs", "VS"));
      }
    }
    roster.replaceChildren(...nodes);
    shown.clear();
    for (const p of players) shown.add(p.id);
  }

  function renderMaps(phase) {
    const counts = voteCounts();
    const top = Math.max(...counts.values());
    const leaders = [...counts].filter(([, n]) => n === top && n > 0);
    const mine = me().vote;
    const locked = phase === "starting";
    const maps = mode().maps.map(([id, name]) => {
      const key = el("button", "k k--map");
      key.classList.toggle("is-picked", locked ? id === winner : id === mine);
      key.classList.toggle("is-out", locked && id !== winner);
      if (locked) key.tabIndex = -1;
      key.style.pointerEvents = locked ? "none" : "";
      key.addEventListener("click", () => { me().vote = id; render(); });

      const shot = el("span", "map-shot");
      const img = el("span", "map-img");
      img.style.setProperty("--img", `url("/data/levelshots/${id}.jpg")`);
      const flags = el("span", "map-flags");
      if (locked && id === winner) flags.append(el("span", "flag flag--win", "Locked in"));
      if (!locked && id === mine) flags.append(el("span", "flag flag--you", "Your vote"));
      if (!locked && leaders.length === 1 && leaders[0][0] === id) flags.append(el("span", "flag", "Leading"));
      shot.append(img, flags);
      const n = counts.get(id);
      if (n > 0) {
        const votes = el("span", "map-votes", String(n));
        votes.append(el("small", "", n === 1 ? "vote" : "votes"));
        shot.append(votes);
      }

      const info = el("span", "map-info");
      info.append(el("span", "map-name", name), el("span", "map-id", id));
      const face = el("span", "k-face");
      face.append(shot, info);
      key.append(el("span", "k-side"), face);
      return key;
    });
    document.getElementById("maps").replaceChildren(...maps);
  }

  function renderStatus(phase) {
    const m = mode();
    const n = players.length;
    const ready = players.filter((p) => p.ready).length;
    const other = players.find((p) => p.name !== ME);
    let kicker, head, sub, fill;
    if (phase === "searching") {
      kicker = "Matchmaking";
      if (m.layout === "vs") {
        head = "Searching for opponent";
        sub = "Share the invite, or add a bot to play right now.";
      } else if (m.teams) {
        head = "Searching for players";
        sub = `Needs someone on each side to start · <b>${m.max - n}</b> seats open`;
      } else {
        head = "Searching for players";
        sub = `<b>${m.min - n} more</b> to go · starts when all ${m.min} are in and ready`;
      }
      fill = n / m.max;
    } else if (phase === "ready") {
      if (m.layout === "vs") {
        kicker = "Match found";
        head = "Opponent found";
        sub = me().ready
          ? `Waiting for <b>${other.name}</b> to ready up`
          : `<b>${other.name}</b> is in${other.ready ? " and ready" : ""}. Ready up to start.`;
      } else if (m.teams) {
        const full = n === m.max;
        kicker = full ? "Teams full" : "Enough to start";
        head = full ? "Ready up" : "Ready when you are";
        sub = `<b>${ready} / ${n}</b> ready` + (full ? "" : ` · ${m.max - n} seats stay open until it starts`);
      } else {
        kicker = "Lobby full";
        head = "Ready up";
        sub = `<b>${ready} / ${n}</b> ready · starts the moment everyone is`;
      }
      fill = ready / n;
    } else {
      kicker = "All ready";
      head = "Match starting";
      sub = `Spawning server · <b>${mapName(winner)}</b>`;
      fill = 1;
    }
    document.getElementById("statusKicker").textContent = kicker;
    document.getElementById("statusHead").textContent = head;
    document.getElementById("statusSub").innerHTML = sub;
    document.getElementById("statusFill").style.width = `${Math.round(fill * 100)}%`;
    document.getElementById("countNow").textContent = n;
    document.getElementById("countMax").textContent = m.max;
    document.getElementById("radarCore").textContent = phase === "ready" ? "!" : "";
    tickClock(phase);
  }

  function tickClock(phase) {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    document.getElementById("clock").textContent =
      phase === "starting" ? "Get set" : `Waiting ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  function renderActions(phase) {
    const m = mode();
    const n = players.length;
    const locked = phase === "starting";

    const addBot = document.getElementById("addBot");
    addBot.disabled = locked || n >= m.max;
    const open = m.max - n;
    document.getElementById("addBotHint").textContent = open ? `${open} seat${open === 1 ? "" : "s"} open` : "Room full";

    const switchSide = document.getElementById("switchSide");
    const shuffle = document.getElementById("shuffle");
    switchSide.style.display = shuffle.style.display = m.teams ? "" : "none";
    if (m.teams) {
      const target = me().team === "alpha" ? "bravo" : "alpha";
      switchSide.disabled = locked || onTeam(target).length >= m.max / 2;
      document.getElementById("switchHint").textContent = `To Team ${TEAM_NAME[target]}`;
      shuffle.disabled = locked || n < 2;
      document.getElementById("shuffleHint").textContent = `Teams · vote ${shuffleVotes.size} / ${Math.ceil(n / 2)}`;
    }

    const readyKey = document.getElementById("ready");
    const mine = me().ready;
    readyKey.classList.toggle("is-on", mine || locked);
    readyKey.classList.toggle("is-calling", phase === "ready" && !mine);
    readyKey.style.pointerEvents = locked ? "none" : "";
    document.getElementById("readyLabel").textContent = locked ? "Locked in" : mine ? "Ready ✓" : "Ready";
    const ready = players.filter((p) => p.ready).length;
    document.getElementById("readyHint").textContent =
      locked ? "Loading map" : mine ? "Click to cancel" : phase === "searching" ? "Set before they arrive" : `${ready} / ${n} ready`;
  }

  function render() {
    const phase = phaseOf();
    if (phase === "starting" && !winner) {
      winner = pickWinner();
      sys(`Everyone is ready · starting on ${mapName(winner)}`);
    }
    if (phase !== "starting") winner = null;
    stage.dataset.phase = phase;
    document.getElementById("status").dataset.phase = phase;
    renderStatus(phase);
    renderRoster();
    renderMaps(phase);
    renderActions(phase);
    document.getElementById("hereCount").textContent = `${humans().length} here`;
    const presetOf = { searching: "searching", ready: "found", starting: "starting" };
    for (const b of document.querySelectorAll(".proto [data-preset]")) b.classList.toggle("is-on", b.dataset.preset === presetOf[phase]);
  }

  // ── Chat ──
  const log = document.getElementById("chatLog");
  const now = () => { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
  function post(cls, parts) {
    const msg = el("div", `msg ${cls}`);
    msg.append(el("span", "t", now()), ...parts);
    log.append(msg);
    log.scrollTop = log.scrollHeight;
  }
  const sys = (text) => post("msg--sys msg--new", [el("span", "txt", text)]);
  function say(name, text) {
    const who = el("span", "who", name);
    if (CAST[name]) who.style.setProperty("--c", CAST[name]);
    post(name === ME ? "msg--me msg--new" : "msg--new", [who, el("span", "txt", text)]);
  }
  document.getElementById("chatForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    say(ME, text);
    input.value = "";
  });

  // ── Actions ──
  document.getElementById("addBot").addEventListener("click", () => {
    const m = mode();
    if (players.length >= m.max) return;
    botCount++;
    const name = `Bot ${botCount}`;
    let team = "ffa";
    if (m.teams) team = onTeam("alpha").length <= onTeam("bravo").length ? "alpha" : "bravo";
    players.push({ id: `bot${botCount}`, name, team, ready: true, bot: true, vote: null });
    sys(`${name} joined`);
    render();
  });

  document.getElementById("switchSide").addEventListener("click", () => {
    const p = me();
    p.team = p.team === "alpha" ? "bravo" : "alpha";
    shuffleVotes.clear();
    sys(`${ME} switched to Team ${TEAM_NAME[p.team]}`);
    render();
  });

  // Shuffling is a vote: half the room, rounded up. Bots side with the first human who asks.
  document.getElementById("shuffle").addEventListener("click", () => {
    shuffleVotes.add(me().id);
    for (const p of players) if (p.bot) shuffleVotes.add(p.id);
    const needed = Math.ceil(players.length / 2);
    if (shuffleVotes.size >= needed) {
      const order = [...players];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      order.forEach((p, i) => { p.team = i % 2 ? "alpha" : "bravo"; });
      shuffleVotes.clear();
      sys("Teams shuffled");
    } else {
      sys(`${ME} voted to shuffle teams (${shuffleVotes.size} / ${needed})`);
    }
    render();
  });

  document.getElementById("ready").addEventListener("click", () => {
    const p = me();
    p.ready = !p.ready;
    sys(p.ready ? `${ME} is ready` : `${ME} is not ready`);
    render();
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(`https://${SHARE_URL}`); } catch {}
    const label = document.getElementById("copyLabel");
    label.textContent = "Copied ✓";
    setTimeout(() => { label.textContent = "Copy"; }, 1600);
  });

  // ── Prototype: which room, and how far along it is ──
  const stage = document.getElementById("stage");

  function loadPreset(kind) {
    preset = PRESETS.vs[kind] ? kind : "searching";
    kind = preset;
    history.replaceState(null, "", `?mode=${modeKey}&room=${kind}`);
    const m = mode();
    players = PRESETS[m.layout][kind].map(([name, team, ready, v], i) => (
      { id: `p${i}-${name}`, name, team, ready, vote: v == null ? null : m.maps[v][0] }
    ));
    shown.clear();
    winner = null;
    shuffleVotes.clear();
    botCount = 0;
    startedAt = Date.now();
    log.replaceChildren();
    sys(`${ME} opened a ${m.name} lobby`);
    for (const p of players) if (p.name !== ME) sys(`${p.name} joined`);
    if (kind !== "searching") {
      for (const [who, text] of CHATTER[m.layout]) if (players.some((p) => p.name === who)) say(who, text);
    }
    render();
  }

  function setMode(key, room = "searching") {
    modeKey = MODES[key] ? key : "duel";
    const m = mode();
    ACCENT_VARS.forEach((v, i) => stage.style.setProperty(v, m.accent[i]));
    document.getElementById("ghost").textContent = m.name.toUpperCase();
    document.getElementById("modeChip").textContent = m.name;
    document.getElementById("modeSub").textContent = m.sub;
    document.getElementById("playerMeta").textContent = `In ${m.name} lobby`;
    for (const b of document.querySelectorAll(".proto [data-mode]")) b.classList.toggle("is-on", b.dataset.mode === modeKey);
    loadPreset(room);
  }

  for (const b of document.querySelectorAll(".proto [data-mode]")) b.addEventListener("click", () => setMode(b.dataset.mode));
  document.getElementById("playerName").textContent = ME;
  document.querySelector(".util .k").addEventListener("click", () => { location.href = "welcome.html?screen=key"; });
  document.querySelectorAll(".util .k")[1].addEventListener("click", () => { location.href = "settings.html"; });
  for (const b of document.querySelectorAll(".proto [data-preset]")) b.addEventListener("click", () => loadPreset(b.dataset.preset));
  setInterval(() => tickClock(phaseOf()), 1000);

  const params = new URLSearchParams(location.search);
  setMode(params.get("mode"), params.get("room") || undefined);
  // The webfonts change line heights once they land; keep the newest line in view
  document.fonts.ready.then(() => { log.scrollTop = log.scrollHeight; });
</script>
</body>
</html>
