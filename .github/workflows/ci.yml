name: SHAG engine CI

on:
  push:
    branches: ["main", "*-qa-improvements"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout engine only
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Engine profiling helper tests
        run: node --test scripts/benchmarks/__tests__/*.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Biome gate (no new diagnostics over baseline)
        run: npm run gate:biome

      - name: Build engine example
        run: npm run build
        env:
          SHAG_APP: engine

      - name: Build engine manual
        run: npm run docs:build

      # QA-WO3 regression gate: the split reliable router (whose silent dead end
      # shipped the broken-chat bug) must not come back — one router, both channels.
      - name: Trap gate — no split reliable router
        run: |
          if grep -rnE "handleReliable\s*\(" src --include="*.ts"; then
            echo "::error::handleReliable( reappeared — route both channels through handleDatagram (see docs/research/v0.9.18-QA.md QA-7)"
            exit 1
          fi
          echo "OK — single message router intact"
